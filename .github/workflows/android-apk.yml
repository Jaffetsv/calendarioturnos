name: Construir APK Android

# Se puede lanzar a mano desde la pestana "Actions" de GitHub,
# y ademas se ejecuta solo cuando cambia la app.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'apk/**'
      - '.github/workflows/android-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Preparar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3

      - name: Copiar la app web dentro del contenedor
        working-directory: apk
        run: node scripts/copy-app.js

      - name: Instalar dependencias de Capacitor
        working-directory: apk
        run: npm install --no-audit --no-fund

      - name: Generar el proyecto Android
        working-directory: apk
        run: |
          npx cap add android || echo "El proyecto android ya existe, se continua"
          npx cap sync android

      - name: Compilar el APK (debug)
        working-directory: apk/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Renombrar el APK
        run: |
          mkdir -p salida
          cp apk/android/app/build/outputs/apk/debug/app-debug.apk "salida/ShifterPro-v24-debug.apk"

      - name: Publicar el APK como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: ShifterPro-APK
          path: salida/*.apk
          if-no-files-found: error
          retention-days: 90
